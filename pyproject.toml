[project]
name = "prosper-or-perish-profiling"
version = "0.1.0"
description = "Read-only profiling log analyzer for Prosper or Perish and Europa Universalis V."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pp-profile = "prosper_or_perish_profiling.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
